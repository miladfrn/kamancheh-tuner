<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Kamancheh Tuner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /*
    Layout concept: the pitch/waveform panel fills nearly the whole screen
    (the user's main complaint was too little waveform real estate); a thin
    transport strip pins to the bottom for tempo + A/B loop + record.
    Color: warm dark wood/strings palette, not a generic app dark theme.
    Type: Spectral (display, serif — evokes notation/manuscript) + JetBrains
    Mono (numbers: cents, BPM, time) for tabular precision.
  */
  :root {
    --bg: #14110f;
    --panel: #1c1813;
    --panel-2: #241e17;
    --line: #3a3024;
    --fg: #f2ead9;
    --fg-dim: #a89a80;
    --accent: #c98a3a;
    --good: #e8e0cc;
    --bad: #d6553f;
    --string: #7a9b7e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Spectral', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top, 0px)) 16px 8px;
    gap: 8px;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header h1 span { color: var(--accent); }
  #a4 {
    font-size: 11px;
    color: var(--fg-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #a4 input {
    width: 44px;
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: right;
  }
  #a4 input:focus { outline: none; }

  /* ---- main pitch display: the big area ---- */
  #main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
    gap: 8px;
  }

  #gaugeWrap {
    position: relative;
    flex: 0 0 auto;
    padding-top: 6px;
  }
  #noteRow {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 14px;
  }
  #noteName {
    font-size: min(16vw, 110px);
    line-height: 1;
    font-weight: 600;
    transition: color 120ms ease;
  }
  #cents {
    text-align: center;
    font-size: 15px;
    color: var(--fg-dim);
    margin-top: -6px;
  }
  #cents b { color: var(--fg); font-family: 'JetBrains Mono', monospace; font-size: 17px; }

  #needleSvg { width: 100%; height: 46px; display: block; }

  /* ---- waveform / pitch history: now the dominant element ---- */
  #scopeWrap {
    flex: 1 1 auto;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }
  #scope { width: 100%; height: 100%; display: block; }
  #scopeLabel {
    position: absolute;
    top: 8px;
    left: 12px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  #rhythmLegend {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 10px;
    color: var(--fg-dim);
    display: flex;
    gap: 10px;
  }
  #rhythmLegend span { display: flex; align-items: center; gap: 4px; }
  #rhythmLegend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* ---- transport strip ---- */
  #transport {
    flex: 0 0 auto;
    background: var(--panel-2);
    border-top: 1px solid var(--line);
    padding: 10px 16px max(10px, env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.wrap { flex-wrap: wrap; }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1c1200; font-weight: 700; }
  button.on { background: var(--string); border-color: var(--string); color: #0e160f; }
  button.danger.on { background: var(--bad); border-color: var(--bad); color: #220a06; }
  button:disabled { opacity: 0.4; }
  button.icon { padding: 9px; width: 38px; justify-content: center; flex: 0 0 auto; }

  #bpmBlock { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  #bpmNum { font-size: 22px; font-weight: 700; width: 3.2ch; text-align: center; flex: 0 0 auto; }
  #bpmStepper { display: flex; flex-direction: column; gap: 2px; flex: 0 0 auto; }
  #bpmStepper button { padding: 2px 8px; font-size: 10px; }
  #beatDots { display: flex; gap: 5px; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  #beatDots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--line);
    flex: 0 0 auto;
    transition: background 60ms ease, transform 60ms ease;
  }
  #beatDots i.hit { background: var(--accent); transform: scale(1.35); }

  #abBar {
    position: relative;
    height: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    flex: 1 1 auto;
  }
  #abRegion {
    position: absolute;
    top: 0; bottom: 0;
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border-left: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }
  #abPlayhead {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--fg);
  }

  .hint { font-size: 10.5px; color: var(--fg-dim); }

  #status {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 0 32px;
    z-index: 50;
  }
  #status h2 { font-size: 20px; margin: 0; }
  #status p { color: var(--fg-dim); font-size: 14px; max-width: 46ch; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Kaman<span>cheh</span> Tuner</h1>
    <label id="a4">A4<input id="a4input" type="number" value="440" step="1" inputmode="numeric"></label>
  </header>

  <div id="main">
    <div id="gaugeWrap">
      <div id="noteRow">
        <span id="noteName">–</span>
      </div>
      <div id="cents">cents off: <b id="centsVal">0</b></div>
      <svg id="needleSvg" viewBox="0 0 320 60" preserveAspectRatio="xMidYMid meet">
        <line id="needleTick0" x1="20" y1="10" x2="20" y2="18" stroke="#3a3024" stroke-width="2"/>
        <line id="needleTick50" x1="160" y1="6" x2="160" y2="20" stroke="#c98a3a" stroke-width="2"/>
        <line id="needleTick100" x1="300" y1="10" x2="300" y2="18" stroke="#3a3024" stroke-width="2"/>
        <line id="needle" x1="160" y1="2" x2="160" y2="58" stroke="#f2ead9" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="scopeWrap">
      <div id="scopeLabel">Pitch trace</div>
      <div id="rhythmLegend">
        <span><i style="background:var(--good)"></i>on beat</span>
        <span><i style="background:var(--bad)"></i>off beat</span>
      </div>
      <canvas id="scope"></canvas>
    </div>
  </div>

  <div id="transport">
    <div class="row">
      <button id="micBtn" class="primary">● Start mic</button>
      <button id="metroBtn" class="icon" title="Metronome">♩</button>
      <button id="abBtn" class="icon" title="A/B loop">AB</button>
      <span class="hint" id="hintText">Tap Start mic to begin tuning.</span>
    </div>

    <div class="row" id="bpmRow" hidden>
      <div id="bpmBlock">
        <div id="bpmStepper">
          <button id="bpmUp">▲</button>
          <button id="bpmDown">▼</button>
        </div>
        <span id="bpmNum" class="mono">90</span>
        <span class="hint">bpm</span>
        <div id="beatDots"></div>
      </div>
      <button id="tapTempo">Tap</button>
    </div>

    <div class="row" id="abRow" hidden>
      <button id="setA" class="icon">A</button>
      <div id="abBar">
        <div id="abRegion" style="left:10%;width:40%"></div>
        <div id="abPlayhead" style="left:10%"></div>
      </div>
      <button id="setB" class="icon">B</button>
      <button id="loopToggle">Loop</button>
    </div>
  </div>

</div>

<div id="status">
  <h2>Microphone access needed</h2>
  <p id="statusMsg">This tuner listens to your kamancheh through the microphone to show pitch and rhythm in real time. Nothing is recorded or sent anywhere — it all stays on this device.</p>
  <button id="statusBtn" class="primary">Allow microphone</button>
</div>

<script>
(function () {
  "use strict";

  // ---------- note / pitch math ----------
  var NOTE_NAMES = ["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
  var a4 = 440;

  function freqToNote(freq) {
    var midi = 69 + 12 * Math.log2(freq / a4);
    var rounded = Math.round(midi);
    var cents = Math.round((midi - rounded) * 100);
    var name = NOTE_NAMES[((rounded % 12) + 12) % 12];
    var octave = Math.floor(rounded / 12) - 1;
    return { name: name, octave: octave, cents: cents, midi: rounded };
  }

  // Autocorrelation pitch detector (ACF2+), good for monophonic bowed strings.
  function autoCorrelate(buf, sampleRate) {
    var SIZE = buf.length;
    var rms = 0;
    for (var i = 0; i < SIZE; i++) { var v = buf[i]; rms += v * v; }
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.008) return -1;

    var r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (var i2 = 0; i2 < SIZE / 2; i2++) { if (Math.abs(buf[i2]) < thres) { r1 = i2; break; } }
    for (var i3 = 1; i3 < SIZE / 2; i3++) { if (Math.abs(buf[SIZE - i3]) < thres) { r2 = SIZE - i3; break; } }

    var trimmed = buf.slice(r1, r2);
    var n = trimmed.length;
    var c = new Array(n).fill(0);
    for (var lag = 0; lag < n; lag++) {
      for (var j = 0; j < n - lag; j++) c[lag] += trimmed[j] * trimmed[j + lag];
    }
    var d = 0; while (c[d] > c[d + 1]) d++;
    var maxval = -1, maxpos = -1;
    for (var k = d; k < n; k++) { if (c[k] > maxval) { maxval = c[k]; maxpos = k; } }
    var T0 = maxpos;
    if (T0 <= 0) return -1;
    var x1 = c[T0 - 1] || c[T0], x2 = c[T0], x3 = c[T0 + 1] || c[T0];
    var a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);
    return sampleRate / T0;
  }

  // ---------- DOM refs ----------
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), statusMsg = $("statusMsg"), statusBtn = $("statusBtn");
  var micBtn = $("micBtn"), hintText = $("hintText");
  var noteName = $("noteName"), centsVal = $("centsVal"), needle = $("needle");
  var scope = $("scope"), scopeCtx = scope.getContext("2d");
  var a4input = $("a4input");

  var metroBtn = $("metroBtn"), bpmRow = $("bpmRow"), bpmNum = $("bpmNum");
  var bpmUp = $("bpmUp"), bpmDown = $("bpmDown"), tapTempo = $("tapTempo"), beatDots = $("beatDots");
  var abBtn = $("abBtn"), abRow = $("abRow"), abBar = $("abBar"), abRegion = $("abRegion"), abPlayhead = $("abPlayhead");
  var setA = $("setA"), setB = $("setB"), loopToggle = $("loopToggle");

  a4input.addEventListener("change", function () {
    var v = parseFloat(a4input.value);
    if (v && v > 300 && v < 600) a4 = v;
  });

  // ---------- audio graph ----------
  var audioCtx = null, analyser = null, sourceNode = null, buf = null;
  var running = false;

  function initStatusGate() {
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      statusMsg.textContent = "Microphone access requires HTTPS (or localhost). Host this page over HTTPS — e.g. GitHub Pages — then reopen it there.";
      statusBtn.disabled = true;
      statusBtn.textContent = "Needs HTTPS";
    }
  }
  initStatusGate();

  function startMic() {
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      sourceNode = audioCtx.createMediaStreamSource(stream);
      sourceNode.connect(analyser);
      running = true;
      statusEl.hidden = true;
      micBtn.textContent = "■ Stop mic";
      micBtn.classList.add("on");
      hintText.textContent = "Listening…";
      requestAnimationFrame(loop);
    }).catch(function (err) {
      statusMsg.textContent = "Microphone permission was denied or unavailable (" + err.message + "). Allow mic access in your browser's site settings and reload.";
    });
  }

  function stopMic() {
    running = false;
    if (audioCtx) audioCtx.close();
    micBtn.textContent = "● Start mic";
    micBtn.classList.remove("on");
    hintText.textContent = "Tap Start mic to begin tuning.";
    noteName.textContent = "–";
    centsVal.textContent = "0";
  }

  micBtn.addEventListener("click", function () { running ? stopMic() : startMic(); });
  statusBtn.addEventListener("click", startMic);

  // ---------- pitch -> UI ----------
  var pitchHistory = []; // {t, note, cents, freq, onset}
  var lastRms = 0, onsetCooldown = 0;

  function updatePitchUI(freq) {
    if (freq < 0) {
      noteName.style.color = "var(--fg-dim)";
      return;
    }
    var n = freqToNote(freq);
    noteName.textContent = n.name + n.octave;
    centsVal.textContent = (n.cents > 0 ? "+" : "") + n.cents;
    var inTune = Math.abs(n.cents) <= 8;
    noteName.style.color = inTune ? "var(--string)" : (Math.abs(n.cents) <= 20 ? "var(--fg)" : "var(--bad)");

    var clamped = Math.max(-50, Math.min(50, n.cents));
    var angle = (clamped / 50) * 70; // degrees
    var rad = (angle - 90) * Math.PI / 180;
    var cx = 160, cy = 58, len = 54;
    needle.setAttribute("x2", (cx + len * Math.cos(rad)).toFixed(1));
    needle.setAttribute("y2", (cy + len * Math.sin(rad)).toFixed(1));
    needle.setAttribute("stroke", inTune ? "#e8e0cc" : "#d6553f");
  }

  // ---------- scope (waveform + pitch trace + rhythm markers) ----------
  var scopeW = 0, scopeH = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fitScope() {
    var rect = scope.parentElement.getBoundingClientRect();
    scopeW = rect.width; scopeH = rect.height;
    scope.width = scopeW * dpr; scope.height = scopeH * dpr;
    scope.style.width = scopeW + "px"; scope.style.height = scopeH + "px";
    scopeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fitScope);
  fitScope();

  var trace = []; // rolling cents-deviation trace, newest last
  var TRACE_SECONDS = 6;
  var beatMarks = []; // {x: 0..1 relative to now, hit: bool} drawn as vertical lines scrolling through

  function drawScope(timeBuf) {
    scopeCtx.clearRect(0, 0, scopeW, scopeH);

    // faint center line + tuning band
    var midY = scopeH * 0.42;
    scopeCtx.strokeStyle = "#3a302466";
    scopeCtx.lineWidth = 1;
    scopeCtx.beginPath();
    scopeCtx.moveTo(0, midY); scopeCtx.lineTo(scopeW, midY);
    scopeCtx.stroke();

    // live waveform across the bottom band
    var waveTop = scopeH * 0.55, waveH = scopeH * 0.4;
    scopeCtx.strokeStyle = "#c98a3a";
    scopeCtx.lineWidth = 1.5;
    scopeCtx.beginPath();
    var step = Math.max(1, Math.floor(timeBuf.length / scopeW));
    for (var x = 0; x < scopeW; x++) {
      var idx = x * step;
      var v = timeBuf[idx] || 0;
      var y = waveTop + waveH / 2 - v * waveH * 0.48;
      if (x === 0) scopeCtx.moveTo(x, y); else scopeCtx.lineTo(x, y);
    }
    scopeCtx.stroke();

    // pitch deviation trace across the top band (cents, clamped +-50)
    var top = scopeH * 0.06, bandH = scopeH * 0.42;
    if (trace.length > 1) {
      scopeCtx.lineWidth = 2;
      for (var i = 1; i < trace.length; i++) {
        var p0 = trace[i - 1], p1 = trace[i];
        var x0 = (p0.t) * scopeW, x1 = (p1.t) * scopeW;
        var y0 = top + bandH / 2 - (p0.cents / 50) * (bandH / 2);
        var y1 = top + bandH / 2 - (p1.cents / 50) * (bandH / 2);
        scopeCtx.strokeStyle = Math.abs(p1.cents) <= 8 ? "#e8e0cc" : (Math.abs(p1.cents) <= 20 ? "#c98a3a" : "#d6553f");
        scopeCtx.beginPath();
        scopeCtx.moveTo(x0, y0); scopeCtx.lineTo(x1, y1);
        scopeCtx.stroke();
      }
    }

    // rhythm onset markers: vertical lines scrolling left, white=on-beat, red=off-beat
    for (var m = 0; m < beatMarks.length; m++) {
      var mk = beatMarks[m];
      var mx = mk.t * scopeW;
      scopeCtx.strokeStyle = mk.hit ? "#e8e0cc" : "#d6553f";
      scopeCtx.globalAlpha = 0.85;
      scopeCtx.lineWidth = 2;
      scopeCtx.beginPath();
      scopeCtx.moveTo(mx, 0); scopeCtx.lineTo(mx, scopeH);
      scopeCtx.stroke();
      scopeCtx.globalAlpha = 1;
    }
  }

  // ---------- metronome / rhythm ----------
  var bpm = 90, metroOn = false, metroTimer = null, nextBeatTime = 0;
  var beatCount = 0, beatSubdiv = 4; // dots shown per bar (visual only)

  function renderBeatDots() {
    beatDots.innerHTML = "";
    for (var i = 0; i < beatSubdiv; i++) {
      var d = document.createElement("i");
      beatDots.appendChild(d);
    }
  }
  renderBeatDots();

  function setBpm(v) {
    bpm = Math.max(30, Math.min(260, v));
    bpmNum.textContent = bpm;
  }
  setBpm(90);

  function clickSound() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.frequency.value = (beatCount % beatSubdiv === 0) ? 1500 : 1000;
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }

  var lastOnsetBeatDelta = null;

  function metroTick() {
    if (!metroOn) return;
    clickSound();
    var dots = beatDots.children;
    var idx = beatCount % beatSubdiv;
    for (var i = 0; i < dots.length; i++) dots[i].classList.remove("hit");
    if (dots[idx]) dots[idx].classList.add("hit");

    expectedBeatTimes.push(performance.now());
    if (expectedBeatTimes.length > 40) expectedBeatTimes.shift();

    beatCount++;
    var interval = 60000 / bpm;
    nextBeatTime += interval;
    var delay = Math.max(0, nextBeatTime - performance.now());
    metroTimer = setTimeout(metroTick, delay);
  }

  var expectedBeatTimes = [];

  function startMetro() {
    metroOn = true;
    beatCount = 0;
    nextBeatTime = performance.now();
    metroTick();
  }
  function stopMetro() {
    metroOn = false;
    if (metroTimer) clearTimeout(metroTimer);
    var dots = beatDots.children;
    for (var i = 0; i < dots.length; i++) dots[i].classList.remove("hit");
  }

  metroBtn.addEventListener("click", function () {
    bpmRow.hidden = !bpmRow.hidden;
    if (bpmRow.hidden) { stopMetro(); metroBtn.classList.remove("on"); }
    else { startMetro(); metroBtn.classList.add("on"); }
  });
  bpmUp.addEventListener("click", function () { setBpm(bpm + 2); });
  bpmDown.addEventListener("click", function () { setBpm(bpm - 2); });

  var tapTimes = [];
  tapTempo.addEventListener("click", function () {
    var now = performance.now();
    tapTimes.push(now);
    tapTimes = tapTimes.filter(function (t) { return now - t < 3000; });
    if (tapTimes.length > 1) {
      var intervals = [];
      for (var i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
      var avg = intervals.reduce(function (a, b) { return a + b; }, 0) / intervals.length;
      setBpm(Math.round(60000 / avg));
    }
  });

  // ---------- A/B loop (practice a section repeatedly against the beat) ----------
  var abOn = false, aPct = 0.1, bPct = 0.5, loopActive = false;
  abBtn.addEventListener("click", function () {
    abRow.hidden = !abRow.hidden;
    abBtn.classList.toggle("on", !abRow.hidden);
  });
  function renderAB() {
    abRegion.style.left = (aPct * 100) + "%";
    abRegion.style.width = ((bPct - aPct) * 100) + "%";
  }
  setA.addEventListener("click", function () {
    aPct = Math.max(0, Math.min(bPct - 0.05, aPct));
    aPct = currentPlayheadPct();
    if (aPct >= bPct) bPct = Math.min(1, aPct + 0.1);
    renderAB();
  });
  setB.addEventListener("click", function () {
    bPct = currentPlayheadPct();
    if (bPct <= aPct) aPct = Math.max(0, bPct - 0.1);
    renderAB();
  });
  loopToggle.addEventListener("click", function () {
    loopActive = !loopActive;
    loopToggle.classList.toggle("on", loopActive);
  });
  renderAB();

  // the playhead sweeps once per 2 loop-lengths as a simple visual metronome-independent
  // time reference the player can use to mark A and B while practicing freely.
  var playheadStart = performance.now(), playheadPeriodMs = 8000;
  function currentPlayheadPct() {
    var el = (performance.now() - playheadStart) % playheadPeriodMs;
    return el / playheadPeriodMs;
  }
  function tickPlayhead() {
    var pct = currentPlayheadPct();
    if (loopActive && (pct < aPct || pct > bPct)) {
      playheadStart = performance.now() - aPct * playheadPeriodMs;
      pct = aPct;
    }
    abPlayhead.style.left = (pct * 100) + "%";
    requestAnimationFrame(tickPlayhead);
  }
  tickPlayhead();

  // ---------- main loop ----------
  var startTime = null;
  function loop(ts) {
    if (!running) return;
    if (startTime === null) startTime = ts;
    analyser.getFloatTimeDomainData(buf);
    var freq = autoCorrelate(buf, audioCtx.sampleRate);
    updatePitchUI(freq);

    // rms for onset detection
    var rms = 0;
    for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / buf.length);
    var now = performance.now();
    if (rms > 0.05 && lastRms <= 0.05 && now - onsetCooldown > 150) {
      onsetCooldown = now;
      registerOnset(now);
    }
    lastRms = rms;

    var tNorm = (now % (TRACE_SECONDS * 1000)) / (TRACE_SECONDS * 1000);
    if (trace.length && tNorm < trace[trace.length - 1].t) trace = []; // wrapped
    if (freq > 0) {
      var n = freqToNote(freq);
      trace.push({ t: tNorm, cents: n.cents });
      if (trace.length > 600) trace.shift();
    }

    beatMarks = beatMarks.filter(function (m) {
      m.t = (now % (TRACE_SECONDS * 1000)) / (TRACE_SECONDS * 1000);
      return true;
    });

    drawScope(buf);
    requestAnimationFrame(loop);
  }

  function registerOnset(now) {
    if (!metroOn || expectedBeatTimes.length === 0) return;
    var nearest = null, best = Infinity;
    for (var i = 0; i < expectedBeatTimes.length; i++) {
      var d = Math.abs(expectedBeatTimes[i] - now);
      if (d < best) { best = d; nearest = expectedBeatTimes[i]; }
    }
    var tolerance = Math.min(140, (60000 / bpm) * 0.22);
    var hit = best <= tolerance;
    var tNorm = (now % (TRACE_SECONDS * 1000)) / (TRACE_SECONDS * 1000);
    beatMarks.push({ t: tNorm, hit: hit });
    if (beatMarks.length > 80) beatMarks.shift();
  }

})();
</script>
</body>
