<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Kamancheh Tuner</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /*
    Layout: a slim control bar up top (tempo + start/stop + current note),
    a 2-way tab switcher, then one full-height scrollable panel at a time:
    a continuous scatter of dots on a 5-line staff (replacing guessed note
    durations — every frame plots exactly where the pitch fell), or a
    SoundCorset-style +-40 cent contour. Both share one rolling 4-minute
    timeline. No colored judgement anywhere yet — there is no reference
    score to grade against, so everything is single-color until one
    exists.
    Color: warm dark wood/strings palette.
    Type: Spectral (display, serif) + JetBrains Mono (numbers).
  */
  :root {
    --bg: #14110f;
    --panel: #1c1813;
    --panel-2: #241e17;
    --line: #3a3024;
    --fg: #f2ead9;
    --fg-dim: #a89a80;
    --accent: #c98a3a;
    --string: #7a9b7e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Spectral', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(8px, env(safe-area-inset-top, 0px)) 16px 6px;
    gap: 8px;
    flex: 0 0 auto;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header h1 span { color: var(--accent); }
  header .right { display: flex; align-items: center; gap: 6px; }
  #a4 {
    font-size: 11px; color: var(--fg-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px;
    display: flex; align-items: center; gap: 7px;
  }
  #a4 input {
    width: 34px; background: transparent; border: none; color: var(--fg);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right;
    letter-spacing: 0.02em; padding: 0;
    -moz-appearance: textfield;
  }
  #a4 input:focus { outline: none; }
  #a4 input::-webkit-outer-spin-button,
  #a4 input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .a4step {
    width: 19px; height: 19px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; background: transparent; border: 1px solid var(--line);
    color: var(--fg-dim); flex: 0 0 auto;
  }

  #main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; gap: 6px; }

  /* ---- slim control bar ---- */
  #controlBar {
    flex: 0 0 auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
  }
  #preStart { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #postStart { display: flex; align-items: center; gap: 10px; }

  #beatAdjust { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  #beatArrows { display: flex; flex-direction: row; gap: 4px; }
  #beatArrows button {
    width: 32px; height: 32px; padding: 0; font-size: 15px;
    justify-content: center;
  }
  #beatNumWrap { position: relative; display: inline-block; padding-right: 22px; }
  #beatNum {
    font-size: 30px; font-weight: 700; display: inline-block;
    border-radius: 6px; transition: background 150ms ease, color 150ms ease;
    padding: 0 2px;
  }
  #beatNum.pulse { background: var(--accent); color: #1c1200; }
  .bpmLabel {
    position: absolute; right: 0; bottom: 2px;
    font-size: 9px; color: var(--fg-dim);
  }

  #startButtons { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  button.startBtn {
    flex: 1 1 0;
    min-width: 0;
    flex-direction: column;
    gap: 1px;
    text-align: center;
    padding: 8px 6px;
    line-height: 1.25;
  }
  button.startBtn .l1 { font-size: 11.5px; font-weight: 700; }
  button.startBtn .l2 { font-size: 9.5px; font-weight: 400; color: inherit; opacity: 0.85; }

  #liveNote { flex: 0 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 10px; overflow: hidden; }
  #liveNoteName { font-weight: 600; font-size: 32px; transition: color 120ms ease; flex: 0 0 auto; }
  #liveNoteName sup { font-size: 0.48em; vertical-align: 55%; }
  #liveNoteName sub { font-size: 0.48em; vertical-align: -15%; }
  #liveNoteCents {
    font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 19px;
    color: var(--fg); flex: 0 0 auto;
  }
  #liveNoteFreq {
    font-family: 'JetBrains Mono', monospace; font-weight: 300; font-size: 11px;
    color: var(--fg-dim); flex: 0 0 auto;
  }

  /* ---- bottom status bar ---- */
  #statusBar {
    flex: 0 0 auto;
    background: var(--panel-2);
    border-top: 1px solid var(--line);
    padding: 7px 16px max(7px, env(safe-area-inset-bottom, 0px));
    margin: 6px -16px 0;
  }
  #statusBarText { font-size: 11px; color: var(--fg-dim); font-family: 'JetBrains Mono', monospace; }

  /* ---- tab switcher ---- */
  #tabBar { flex: 0 0 auto; display: flex; gap: 6px; }
  #tabBar button { flex: 1 1 0; justify-content: center; font-size: 11.5px; }
  #tabBar button.on { background: var(--accent); border-color: var(--accent); color: #1c1200; font-weight: 700; }

  /* ---- scope panel ---- */
  #scopeOuter {
    flex: 1 1 auto; min-height: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: row;
  }
  #scopeGutter {
    flex: 0 0 28px; display: flex; flex-direction: column;
    font-size: 9px; font-family: 'JetBrains Mono', monospace; color: var(--fg-dim);
    text-align: center; border-right: 1px solid var(--line);
  }
  #scopeGutterNums {
    flex: 1 1 auto; display: flex; flex-direction: column;
    justify-content: space-between; padding: 4px 0;
  }
  #scopeGutterNums span:nth-child(5) { color: var(--string); font-weight: 700; }
  #scopeGutterNotes { flex: 1 1 auto; position: relative; }
  .gutterNoteLabel {
    position: absolute; left: 0; right: 0; text-align: center;
    transform: translateY(-50%); line-height: 1;
  }
  #scopeGutterSpacer { flex: 0 0 18px; border-top: 1px solid var(--line); }
  #scopeScroll {
    flex: 1 1 auto; min-width: 0;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; touch-action: pan-x;
  }
  #scopeInner { height: 100%; display: flex; flex-direction: column; }
  #scopeCanvases { flex: 1 1 auto; min-height: 0; position: relative; }
  #contourCanvas, #staffCanvas { position: absolute; top: 0; left: 0; height: 100%; display: block; }
  #timeAxisCanvas { flex: 0 0 18px; display: block; border-top: 1px solid var(--line); }

  #zoomControls { position: absolute; top: 8px; left: 39px; z-index: 3; display: flex; gap: 4px; }
  #zoomControls button { width: 26px; height: 26px; padding: 0; justify-content: center; font-size: 13px; background: #1c1813dd; }

  #liveBtn {
    position: absolute; right: 10px; bottom: 26px; z-index: 3;
    font-size: 9.5px; padding: 6px 10px;
  }
  #rollToggle {
    position: absolute; top: 8px; right: 10px; z-index: 3;
    font-size: 9.5px; padding: 6px 10px;
  }
  #pitchScaleToggle {
    position: absolute; top: 40px; right: 10px; z-index: 3;
    font-size: 9.5px; padding: 6px 10px;
  }
  #liveBtn:not(.on), #rollToggle:not(.on), #pitchScaleToggle:not(.on) { background: #1c1813dd; }

  button {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 10px; padding: 9px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    -webkit-user-select: none; user-select: none;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1c1200; font-weight: 700; }
  button.on { background: var(--string); border-color: var(--string); color: #0e160f; }
  button:disabled { opacity: 0.4; }
  button.icon { padding: 9px; width: 38px; justify-content: center; flex: 0 0 auto; }
  button.ghost { background: transparent; }

  .hint { font-size: 10.5px; color: var(--fg-dim); }

  #status {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 0 32px; z-index: 50;
  }
  #status h2 { font-size: 20px; margin: 0; }
  #status p { color: var(--fg-dim); font-size: 14px; max-width: 46ch; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>Kaman<span>cheh</span> Tuner</h1>
    <div class="right">
      <div id="a4">
        <span>A4</span>
        <input id="a4input" type="number" value="440" step="1" inputmode="numeric">
        <button id="a4down" class="a4step">−</button>
        <button id="a4up" class="a4step">+</button>
      </div>
    </div>
  </header>

  <div id="main">
    <div id="controlBar">
      <div id="preStart">
        <div id="beatAdjust">
          <div id="beatArrows">
            <button id="beatDown">▼</button>
            <button id="beatUp">▲</button>
          </div>
          <div id="beatNumWrap">
            <span id="beatNum" class="mono">60</span>
            <span class="bpmLabel">bpm</span>
          </div>
        </div>
        <div id="startButtons">
          <button id="startManual" class="primary startBtn">
            <span class="l1">Start</span><span class="l2" id="startManualLabel">@ 60 bpm</span>
          </button>
          <button id="startAuto" class="startBtn">
            <span class="l1" id="startAutoLabel">Start</span><span class="l2" id="startAutoLabel2">auto tempo</span>
          </button>
        </div>
      </div>
      <div id="postStart" hidden>
        <div id="liveNote">
          <span id="liveNoteName">–</span>
          <span id="liveNoteCents">0¢</span>
          <span id="liveNoteFreq">0Hz</span>
        </div>
        <button id="pauseBtn" class="startBtn">
          <span class="l1" id="pauseLabel">Pause</span><span class="l2">rec</span>
        </button>
        <button id="stopBtn" class="primary startBtn">
          <span class="l1">Stop</span><span class="l2">mic</span>
        </button>
      </div>
    </div>

    <div id="tabBar">
      <button id="tabStaff" class="on">Staff</button>
      <button id="tabContour">Contour</button>
    </div>

    <div id="scopeOuter">
      <div id="scopeGutter">
        <div id="scopeGutterNums">
          <span>40</span><span>30</span><span>20</span><span>10</span><span>0</span><span>-10</span><span>-20</span><span>-30</span><span>-40</span>
        </div>
        <div id="scopeGutterNotes" hidden></div>
        <div id="scopeGutterSpacer"></div>
      </div>
      <div id="scopeScroll">
        <div id="scopeInner">
          <div id="scopeCanvases">
            <canvas id="staffCanvas"></canvas>
            <canvas id="contourCanvas" hidden></canvas>
          </div>
          <canvas id="timeAxisCanvas"></canvas>
        </div>
      </div>
      <div id="zoomControls">
        <button id="zoomOut" class="icon" title="Zoom out">−</button>
        <button id="zoomIn" class="icon" title="Zoom in">+</button>
      </div>
      <button id="rollToggle" title="How the timeline moves through silence">Pause on silence</button>
      <button id="pitchScaleToggle" title="Space staff lines by real pitch distance">Pitch-scaled lines</button>
      <button id="liveBtn" class="on">● following live</button>
    </div>

    <div id="statusBar"><span id="statusBarText">Tap a Start button to begin.</span></div>
  </div>

</div>

<div id="status">
  <h2>Microphone access needed</h2>
  <p id="statusMsg">This tuner listens to your kamancheh through the microphone to show pitch and rhythm in real time. Nothing is recorded or sent anywhere — it all stays on this device.</p>
  <button id="statusBtn" class="primary">Allow microphone</button>
</div>

<script>
(function () {
  "use strict";

  // ---------- note / pitch math ----------
  var NOTE_NAMES = ["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
  var LETTER_BY_PC = ["C","C","D","D","E","F","F","G","G","A","A","B"];
  var SHARP_BY_PC  = [false,true,false,true,false,false,true,false,true,false,true,false];
  var DIATONIC_INDEX = { C:0, D:1, E:2, F:3, G:4, A:5, B:6 };
  var a4 = 440;
  var MIDI_MIN = 36, MIDI_MAX = 100; // plausible kamancheh+voice range; clamps octave-error glitches

  function pc(midi) { return ((midi % 12) + 12) % 12; }
  function midiOctave(midi) { return Math.floor(midi / 12) - 1; }
  function noteLabel(midi) { return NOTE_NAMES[pc(midi)] + midiOctave(midi); }
  function diatonicStep(midi) {
    var letter = LETTER_BY_PC[pc(midi)];
    return DIATONIC_INDEX[letter] + 7 * midiOctave(midi);
  }
  var E4_STEP = diatonicStep(64); // bottom staff line reference

  // Autocorrelation pitch detector (ACF2+), good for monophonic bowed strings and voice.
  function autoCorrelate(buf, sampleRate) {
    var SIZE = buf.length;
    var rms = 0;
    for (var i = 0; i < SIZE; i++) { var v = buf[i]; rms += v * v; }
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.0015) return -1;

    var r1 = 0, r2 = SIZE - 1, thres = 0.15;
    for (var i2 = 0; i2 < SIZE / 2; i2++) { if (Math.abs(buf[i2]) < thres) { r1 = i2; break; } }
    for (var i3 = 1; i3 < SIZE / 2; i3++) { if (Math.abs(buf[SIZE - i3]) < thres) { r2 = SIZE - i3; break; } }

    var trimmed = buf.slice(r1, r2);
    var n = trimmed.length;
    var c = new Array(n).fill(0);
    for (var lag = 0; lag < n; lag++) {
      for (var j = 0; j < n - lag; j++) c[lag] += trimmed[j] * trimmed[j + lag];
    }
    var d = 0; while (c[d] > c[d + 1]) d++;
    var maxval = -1, maxpos = -1;
    for (var k = d; k < n; k++) { if (c[k] > maxval) { maxval = c[k]; maxpos = k; } }
    var T0 = maxpos;
    if (T0 <= 0) return -1;
    var x1 = c[T0 - 1] || c[T0], x2 = c[T0], x3 = c[T0 + 1] || c[T0];
    var aa = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
    if (aa) T0 = T0 - bb / (2 * aa);
    return sampleRate / T0;
  }

  // ---------- DOM refs ----------
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), statusMsg = $("statusMsg"), statusBtn = $("statusBtn");
  var statusBarText = $("statusBarText");
  var a4input = $("a4input");

  function setStatus(text) { statusBarText.textContent = text; }

  var preStart = $("preStart"), postStart = $("postStart");
  var beatUp = $("beatUp"), beatDown = $("beatDown"), beatNum = $("beatNum");
  var startManual = $("startManual"), startManualLabel = $("startManualLabel");
  var startAuto = $("startAuto"), startAutoLabel = $("startAutoLabel"), startAutoLabel2 = $("startAutoLabel2");
  var stopBtn = $("stopBtn"), pauseBtn = $("pauseBtn"), pauseLabel = $("pauseLabel");
  var liveNoteName = $("liveNoteName"), liveNoteCents = $("liveNoteCents"), liveNoteFreq = $("liveNoteFreq");

  var tabStaff = $("tabStaff"), tabContour = $("tabContour");
  var scopeGutter = $("scopeGutter"), scopeGutterNums = $("scopeGutterNums"), scopeGutterNotes = $("scopeGutterNotes");
  var contourCanvas = $("contourCanvas"), contourCtx = contourCanvas.getContext("2d");
  var staffCanvas = $("staffCanvas"), staffCtx = staffCanvas.getContext("2d");
  var timeAxisCanvas = $("timeAxisCanvas"), timeAxisCtx = timeAxisCanvas.getContext("2d");
  var scopeCanvases = $("scopeCanvases");
  var scopeScroll = $("scopeScroll"), scopeInner = $("scopeInner"), liveBtn = $("liveBtn");
  var zoomIn = $("zoomIn"), zoomOut = $("zoomOut");
  var a4down = $("a4down"), a4up = $("a4up");
  var rollToggle = $("rollToggle"), pitchScaleToggle = $("pitchScaleToggle");

  // Roll with time (default): the x-axis keeps moving at real speed even
  // through silence, so a rest between two notes shows as real empty space.
  // Pause on silence: the axis only advances while sound is heard, so gaps
  // between notes aren't visible on the timeline.
  var rollWithTime = true;
  rollToggle.addEventListener("click", function () {
    rollWithTime = !rollWithTime;
    rollToggle.classList.toggle("on", !rollWithTime); // fixed label; highlighted only while pause-on-silence is active
  });

  // Pitch-scaled lines (Staff tab only, off by default): redraws the staff
  // with line spacing proportional to real semitone distance instead of
  // equal diatonic spacing, and plots each dot at its true continuous
  // pitch instead of snapping to the nearest note.
  var pitchScaled = false;
  pitchScaleToggle.addEventListener("click", function () {
    pitchScaled = !pitchScaled;
    pitchScaleToggle.classList.toggle("on", pitchScaled);
    updateGutterAndOffsets();
  });

  function setA4(v) {
    v = Math.max(300, Math.min(600, Math.round(v)));
    a4 = v;
    a4input.value = v;
  }
  a4input.addEventListener("change", function () {
    var v = parseFloat(a4input.value);
    if (v && v > 300 && v < 600) setA4(v);
  });
  a4down.addEventListener("click", function () { setA4(a4 - 1); });
  a4up.addEventListener("click", function () { setA4(a4 + 1); });

  // ---------- tabs ----------
  var activeTab = "staff";
  function updateGutterAndOffsets() {
    // gutter is always visible now: cents numbers on Contour, note names
    // (at equal or pitch-scaled spacing) on Staff
    scopeGutter.hidden = false;
    scopeGutterNums.hidden = activeTab !== "contour";
    scopeGutterNotes.hidden = activeTab !== "staff";
    pitchScaleToggle.hidden = activeTab !== "staff";
    if (activeTab === "staff") renderGutterNotes();
    fitScopes();
    if (activeTab === "staff") drawStaff(); else drawContour();
    drawTimeAxis();
  }
  function setTab(t) {
    activeTab = t;
    tabStaff.classList.toggle("on", t === "staff");
    tabContour.classList.toggle("on", t === "contour");
    staffCanvas.hidden = t !== "staff";
    contourCanvas.hidden = t !== "contour";
    updateGutterAndOffsets();
  }
  tabStaff.addEventListener("click", function () { setTab("staff"); });
  tabContour.addEventListener("click", function () { setTab("contour"); });

  // ---------- audio graph ----------
  var audioCtx = null, analyser = null, sourceNode = null, gainNode = null, buf = null;
  var micRunning = false;
  var inputGain = 6; // boosts quiet sources (singing, far mic) so detection still triggers

  function initStatusGate() {
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      statusMsg.textContent = "Microphone access requires HTTPS (or localhost). Host this page over HTTPS — e.g. GitHub Pages — then reopen it there.";
      statusBtn.disabled = true;
      statusBtn.textContent = "Needs HTTPS";
    }
  }
  initStatusGate();

  // requestMic(): just grants mic access and starts live pitch detection.
  // It does NOT start a recorded session — that happens via the Start
  // buttons in the control bar (startManual / startAuto).
  function requestMic() {
    setStatus("Requesting microphone…");
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      sourceNode = audioCtx.createMediaStreamSource(stream);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = inputGain;
      sourceNode.connect(gainNode);
      gainNode.connect(analyser);
      micRunning = true;
      statusEl.hidden = true;
      setStatus("Microphone ready.");
      fitScopes();
      requestAnimationFrame(loop);
      if (pendingAfterMic) { var fn = pendingAfterMic; pendingAfterMic = null; fn(); }
    }).catch(function (err) {
      statusMsg.textContent = "Microphone permission was denied or unavailable (" + err.message + "). Allow mic access in your browser's site settings and reload.";
      statusBtn.hidden = false;
      setStatus("Microphone permission denied.");
    });
  }
  statusBtn.addEventListener("click", requestMic);

  function resetSessionData() {
    segments = []; curSegment = null;
    scatterPoints = [];
    activeMs = 0; windowStart = 0; lastFrameNow = null;
    lastDotPc = null; lastCanvasWidthPx = -1;
  }

  function beginSession(msg) {
    if (!sessionStarted) resetSessionData();
    sessionStarted = true;
    sessionPaused = false;
    preStart.hidden = true;
    postStart.hidden = false;
    setStatus(msg || ("Session started at " + bpm + " bpm."));
  }
  function endSession() {
    sessionStarted = false;
    sessionPaused = false;
    autoFinding = false;
    resetSessionData();
    preStart.hidden = false;
    postStart.hidden = true;
    liveNoteName.textContent = "–";
    liveNoteCents.textContent = "0¢";
    liveNoteFreq.textContent = "0Hz";
  }
  stopBtn.addEventListener("click", function () {
    if (audioCtx) audioCtx.close();
    micRunning = false;
    endSession();
    setStatus("Stopped.");
  });
  pauseBtn.addEventListener("click", function () {
    sessionPaused = !sessionPaused;
    pauseBtn.classList.toggle("on", sessionPaused);
    pauseLabel.textContent = sessionPaused ? "Resume" : "Pause";
    setStatus(sessionPaused ? "Paused — mic still listening, nothing new is being recorded." : "Resumed.");
  });

  // ---------- committed-note smoothing (kills frame jitter + octave-error spikes) ----------
  var committedMidi = null, committedCentsEMA = 0;
  var candidateMidi = null, candidateSince = 0;
  var DEBOUNCE_MS = 90, EMA_ALPHA = 0.35;

  function feedPitch(freq, now) {
    if (freq <= 0) return;
    var m = 69 + 12 * Math.log2(freq / a4);
    var rounded = Math.round(m);
    if (rounded < MIDI_MIN || rounded > MIDI_MAX) return;
    var cents = (m - rounded) * 100;

    if (committedMidi === null) {
      committedMidi = rounded; committedCentsEMA = cents; candidateMidi = null;
      return;
    }
    if (rounded === committedMidi) {
      committedCentsEMA += EMA_ALPHA * (cents - committedCentsEMA);
      candidateMidi = null;
      return;
    }
    if (candidateMidi === rounded) {
      if (now - candidateSince >= DEBOUNCE_MS) {
        committedMidi = rounded; committedCentsEMA = cents; candidateMidi = null;
      }
    } else {
      candidateMidi = rounded; candidateSince = now;
    }
  }
  function resetCommitted() { committedMidi = null; committedCentsEMA = 0; candidateMidi = null; }

  function updateLiveNoteUI() {
    if (committedMidi === null) {
      liveNoteName.textContent = "–";
      liveNoteName.style.color = "var(--fg-dim)";
      liveNoteCents.textContent = "0¢";
      liveNoteFreq.textContent = "0Hz";
      return;
    }
    var c = Math.round(committedCentsEMA);
    var freq = a4 * Math.pow(2, (committedMidi + committedCentsEMA / 100 - 69) / 12);
    var pcIdx = pc(committedMidi);
    var letter = NOTE_NAMES[pcIdx].replace("#", "");
    var oct = midiOctave(committedMidi);
    liveNoteName.innerHTML = letter + (SHARP_BY_PC[pcIdx] ? "<sup>#</sup>" : "") + "<sub>" + oct + "</sub>";
    liveNoteCents.textContent = (c > 0 ? "+" : "") + c + "¢";
    liveNoteFreq.textContent = freq.toFixed(1) + "Hz";
    var inTune = Math.abs(c) <= 8;
    liveNoteName.style.color = inTune ? "var(--string)" : (Math.abs(c) <= 20 ? "var(--fg)" : "var(--accent)");
  }

  // ---------- shared rolling timeline ----------
  var PX_PER_SEC = 32;
  var PX_PER_SEC_MIN = 10, PX_PER_SEC_MAX = 90;
  var MAX_SECONDS = 240; // 4 minutes
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  var NOISE_FLOOR = 0.0035;
  var SILENCE_HOLD_MS = 550;
  var soundActive = false, lastSoundAt = 0;
  var activeMs = 0, lastFrameNow = null;
  var windowStart = 0;

  var segments = [];       // contour runs: {midi, points:[{ms,cents}]}
  var curSegment = null;
  var scatterPoints = [];  // staff scatter: {ms, midi, acc}
  var lastDotPc = null;

  var sessionStarted = false;
  var sessionPaused = false;
  var panelH = 0;
  var AXIS_H = 18;
  var followMode = true, lastProgScrollAt = 0;

  function fitScopes() {
    var rect = scopeScroll.getBoundingClientRect();
    panelH = scopeCanvases.getBoundingClientRect().height || (rect.height - AXIS_H);
    resizeCanvasesToWidth(Math.max(rect.width, usedWidthPx()));
  }
  window.addEventListener("resize", fitScopes);

  function usedWidthPx() { return Math.min(MAX_SECONDS, activeMs / 1000) * PX_PER_SEC; }

  var lastCanvasWidthPx = -1;
  function resizeCanvasesToWidth(px) {
    px = Math.max(1, Math.round(px));
    if (Math.abs(px - lastCanvasWidthPx) < 4) return;
    lastCanvasWidthPx = px;
    scopeInner.style.width = px + "px";
    [ [contourCanvas, contourCtx, panelH], [staffCanvas, staffCtx, panelH], [timeAxisCanvas, timeAxisCtx, AXIS_H] ].forEach(function (t) {
      var cv = t[0], ctx = t[1], h = t[2];
      cv.width = px * dpr; cv.height = h * dpr;
      cv.style.width = px + "px"; cv.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
  }

  function xOf(ms) { return (ms - windowStart) / 1000 * PX_PER_SEC; }

  function setZoom(px) {
    PX_PER_SEC = Math.max(PX_PER_SEC_MIN, Math.min(PX_PER_SEC_MAX, px));
    lastCanvasWidthPx = -1;
    resizeCanvasesToWidth(Math.max(scopeScroll.clientWidth, usedWidthPx()));
  }
  zoomIn.addEventListener("click", function () { setZoom(PX_PER_SEC * 1.35); });
  zoomOut.addEventListener("click", function () { setZoom(PX_PER_SEC / 1.35); });

  // ---------- staff geometry (compact, fixed spacing; 2 ledger-guide lines each side) ----------
  function staffLayout() {
    var halfSpacing = 13;
    // Pinned near the top (not centered): on a tall phone panel, centering
    // left the staff floating mid-screen surrounded by empty space, making
    // the ledger lines easy to miss. bottomY is a fixed distance from the
    // panel's top edge, independent of panelH.
    var topMargin = 28;
    var bottomY = topMargin + 14 * halfSpacing; // clears the top ledger line (step 14)
    return { halfSpacing: halfSpacing, bottomY: bottomY };
  }
  function staffY(midi) {
    var g = staffLayout();
    var step = diatonicStep(midi) - E4_STEP;
    return g.bottomY - step * g.halfSpacing;
  }

  // ---------- pitch-scaled mode: line spacing proportional to real semitones ----------
  var LETTER_ORDER = ["C", "D", "E", "F", "G", "A", "B"];
  var LETTER_SEMITONE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  var LABELED_STEPS = [-6, -4, -2, 0, 2, 4, 6, 8, 10, 12, 14]; // every staff line + ledger position
  function stepToMidi(step) {
    var absIndex = step + E4_STEP;
    var octave = Math.floor(absIndex / 7);
    var letter = LETTER_ORDER[absIndex - octave * 7];
    return 12 * (octave + 1) + LETTER_SEMITONE[letter];
  }
  var PX_PER_SEMITONE = 8;
  var PITCH_TOP_MARGIN = 28;
  var PITCH_REF_MIDI = stepToMidi(14); // E6, top ledger position
  function pitchScaleY(midiFloat) {
    return PITCH_TOP_MARGIN + (PITCH_REF_MIDI - midiFloat) * PX_PER_SEMITONE;
  }
  function renderGutterNotes() {
    scopeGutterNotes.innerHTML = "";
    LABELED_STEPS.forEach(function (step) {
      var midi = stepToMidi(step);
      var el = document.createElement("span");
      el.className = "gutterNoteLabel";
      el.style.top = (pitchScaled ? pitchScaleY(midi) : staffY(midi)) + "px";
      el.textContent = noteLabel(midi);
      scopeGutterNotes.appendChild(el);
    });
  }

  // vertical grid lines at every beat, per the current bpm (e.g. 60 bpm = 1 line/sec)
  function drawBeatGrid(ctx, w, y0, y1) {
    var bm = 60000 / bpm;
    if (bm < 4) return;
    ctx.strokeStyle = "#ffffff14";
    ctx.lineWidth = 1;
    var firstK = Math.floor(windowStart / bm);
    for (var k = firstK; k < firstK + 100000; k++) {
      var x = xOf(k * bm);
      if (x > w + 5) break;
      if (x < -5) continue;
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    }
  }

  function drawStaff() {
    var w = lastCanvasWidthPx, h = panelH;
    staffCtx.clearRect(0, 0, w, h);
    var g = staffLayout();
    if (rollWithTime) drawBeatGrid(staffCtx, w, 0, h);

    // reference line y: equal diatonic spacing, or true semitone-proportional spacing
    function lineY(step) {
      return pitchScaled ? pitchScaleY(stepToMidi(step)) : (g.bottomY - step * g.halfSpacing);
    }

    // 3 faint ledger-guide lines each side, always visible
    staffCtx.strokeStyle = "#f2ead933";
    staffCtx.setLineDash([3, 4]);
    staffCtx.lineWidth = 1;
    [ -6, -4, -2, 10, 12, 14 ].forEach(function (step) {
      var y = lineY(step);
      staffCtx.beginPath(); staffCtx.moveTo(0, y); staffCtx.lineTo(w, y); staffCtx.stroke();
    });
    staffCtx.setLineDash([]);

    // 5 staff lines
    staffCtx.strokeStyle = "#f2ead966";
    staffCtx.lineWidth = 1;
    [0, 2, 4, 6, 8].forEach(function (step) {
      var y = lineY(step);
      staffCtx.beginPath(); staffCtx.moveTo(0, y); staffCtx.lineTo(w, y); staffCtx.stroke();
    });

    // dots: snapped to the nearest note's line, or plotted at true continuous pitch
    staffCtx.fillStyle = "#f2ead9";
    for (var n = 0; n < scatterPoints.length; n++) {
      var p = scatterPoints[n];
      var x = xOf(p.ms);
      if (x < -6 || x > w + 6) continue;
      var y = pitchScaled ? pitchScaleY(p.midi + p.cents / 100) : staffY(p.midi);
      staffCtx.beginPath();
      staffCtx.arc(x, y, 2.1, 0, Math.PI * 2);
      staffCtx.fill();
      if (p.acc) {
        staffCtx.save();
        staffCtx.font = "600 10px 'JetBrains Mono', monospace";
        staffCtx.fillText("#", x - 9, y + 3.5);
        staffCtx.restore();
      }
    }
  }

  // ---------- contour panel (SoundCorset-style) ----------
  function drawContour() {
    var w = lastCanvasWidthPx, h = panelH;
    contourCtx.clearRect(0, 0, w, h);

    var top = 4, bandH = h - 8;
    function yOfCents(c) { return top + bandH / 2 - (Math.max(-50, Math.min(50, c)) / 50) * (bandH / 2); }

    contourCtx.fillStyle = "#c98a3a1f";
    contourCtx.fillRect(0, yOfCents(10), w, yOfCents(-10) - yOfCents(10));

    contourCtx.strokeStyle = "#ffffff14";
    contourCtx.lineWidth = 1;
    for (var c = -40; c <= 40; c += 10) {
      var gy = yOfCents(c);
      contourCtx.beginPath(); contourCtx.moveTo(0, gy); contourCtx.lineTo(w, gy); contourCtx.stroke();
    }
    if (rollWithTime) drawBeatGrid(contourCtx, w, top, top + bandH);

    contourCtx.lineWidth = 2;
    contourCtx.font = "600 12px 'JetBrains Mono', monospace";
    var allSegs = curSegment ? segments.concat([curSegment]) : segments;
    for (var s = 0; s < allSegs.length; s++) {
      var seg = allSegs[s];
      if (seg.points.length < 1) continue;
      var x0 = xOf(seg.points[0].ms);
      var x1 = xOf(seg.points[seg.points.length - 1].ms);
      if (x1 < -20 || x0 > w + 20) continue;
      contourCtx.strokeStyle = "#f2ead9";
      contourCtx.beginPath();
      for (var p = 0; p < seg.points.length; p++) {
        var px = xOf(seg.points[p].ms), py = yOfCents(seg.points[p].cents);
        if (p === 0) contourCtx.moveTo(px, py); else contourCtx.lineTo(px, py);
      }
      contourCtx.stroke();
      contourCtx.fillStyle = "#f2ead9";
      contourCtx.fillText(noteLabel(seg.midi), Math.max(2, x0 + 3), Math.max(12, yOfCents(seg.points[0].cents) - 7));
    }
  }

  // ---------- time axis (mm:ss) along the bottom of both panels ----------
  function pickTickIntervalSec() {
    var options = [1, 2, 5, 10, 15, 30, 60];
    for (var i = 0; i < options.length; i++) {
      if (options[i] * PX_PER_SEC >= 45) return options[i];
    }
    return 60;
  }
  function formatTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function drawTimeAxis() {
    var w = lastCanvasWidthPx, h = AXIS_H;
    timeAxisCtx.clearRect(0, 0, w, h);
    var intervalMs = pickTickIntervalSec() * 1000;
    var firstK = Math.floor(windowStart / intervalMs);
    timeAxisCtx.strokeStyle = "#f2ead955";
    timeAxisCtx.fillStyle = "#a89a80";
    timeAxisCtx.font = "500 9px 'JetBrains Mono', monospace";
    timeAxisCtx.textAlign = "center";
    for (var k = firstK; k < firstK + 100000; k++) {
      var tMs = k * intervalMs;
      var x = xOf(tMs);
      if (x > w + 5) break;
      if (x < -5) continue;
      timeAxisCtx.beginPath(); timeAxisCtx.moveTo(x, 0); timeAxisCtx.lineTo(x, 4); timeAxisCtx.stroke();
      timeAxisCtx.fillText(formatTime(tMs / 1000), x, h - 3);
    }
  }

  // ---------- auto-follow scrolling ----------
  // Persistent toggle: tap it anytime to clamp to the latest entries and
  // keep following; scrolling away manually turns it off automatically.
  function setFollowMode(on) {
    followMode = on;
    liveBtn.classList.toggle("on", on);
    liveBtn.textContent = on ? "● following live" : "● snap to live";
    if (on) followScroll();
  }
  scopeScroll.addEventListener("scroll", function () {
    if (performance.now() - lastProgScrollAt < 60) return;
    setFollowMode(false);
  });
  liveBtn.addEventListener("click", function () { setFollowMode(true); });
  function followScroll() {
    if (!followMode) return;
    lastProgScrollAt = performance.now();
    scopeScroll.scrollLeft = scopeScroll.scrollWidth - scopeScroll.clientWidth;
  }

  // ---------- tempo: manual dial + explicit auto-find ----------
  var bpm = 60;
  function setBpmDisplay(v) {
    bpm = Math.max(30, Math.min(260, Math.round(v)));
    beatNum.textContent = bpm;
    startManualLabel.textContent = "@ " + bpm + " bpm";
  }
  setBpmDisplay(60);

  beatUp.addEventListener("click", function () { setBpmDisplay(bpm + 2); });
  beatDown.addEventListener("click", function () { setBpmDisplay(bpm - 2); });

  startManual.addEventListener("click", function () {
    autoFinding = false;
    if (!micRunning) { requestMic(); pendingAfterMic = function () { beginSession(); }; }
    else beginSession();
  });

  var pendingAfterMic = null;
  var autoFinding = false, findDeadline = 0, recentOnsetReal = [];

  var lastShownRemaining = -1;
  function startAutoFind() {
    recentOnsetReal = [];
    autoFinding = true;
    findDeadline = performance.now() + 5000;
    lastShownRemaining = -1;
    setStatus("Listening for a steady pulse… play a few even notes.");
  }
  startAuto.addEventListener("click", function () {
    if (!micRunning) { requestMic(); pendingAfterMic = startAutoFind; }
    else startAutoFind();
  });

  function pulseBeatNum() {
    beatNum.classList.add("pulse");
    clearTimeout(pulseBeatNum._t);
    pulseBeatNum._t = setTimeout(function () { beatNum.classList.remove("pulse"); }, 250);
  }

  function trackAutoTempoOnset(nowReal) {
    recentOnsetReal.push(nowReal);
    if (recentOnsetReal.length > 6) recentOnsetReal.shift();
    if (recentOnsetReal.length < 4) return;
    var ivs = [];
    for (var i = 1; i < recentOnsetReal.length; i++) ivs.push(recentOnsetReal[i] - recentOnsetReal[i - 1]);
    var mean = ivs.reduce(function (a, b) { return a + b; }, 0) / ivs.length;
    var variance = ivs.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / ivs.length;
    var sd = Math.sqrt(variance);
    if (mean > 180 && mean < 2200 && sd / mean < 0.12) {
      setBpmDisplay(60000 / mean);
      pulseBeatNum();
      if (autoFinding) {
        autoFinding = false;
        if (!sessionStarted) beginSession("Tempo locked at " + bpm + " bpm — session started.");
      }
    }
  }

  // ---------- onset detection (feeds auto-tempo only) ----------
  var lastRms = 0, onsetCooldown = 0;

  // ---------- main loop ----------
  function loop(ts) {
    if (!micRunning) return;
    analyser.getFloatTimeDomainData(buf);
    var freq = autoCorrelate(buf, audioCtx.sampleRate);

    var rms = 0;
    for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / buf.length);
    var now = performance.now();

    var onsetThresh = Math.max(0.025, NOISE_FLOOR * 6);
    var onsetNow = rms > onsetThresh && lastRms <= onsetThresh && now - onsetCooldown > 150;
    if (onsetNow) onsetCooldown = now;
    lastRms = rms;

    if (rms > NOISE_FLOOR) lastSoundAt = now;
    var wasActive = soundActive;
    soundActive = (now - lastSoundAt) < SILENCE_HOLD_MS;

    feedPitch(freq, now);
    updateLiveNoteUI();

    if (onsetNow && autoFinding) trackAutoTempoOnset(now);
    if (autoFinding) {
      var remaining = Math.max(0, Math.ceil((findDeadline - now) / 1000));
      if (remaining !== lastShownRemaining) {
        lastShownRemaining = remaining;
        setStatus("Listening for a steady pulse… " + remaining + "s");
      }
      if (now > findDeadline) {
        autoFinding = false;
        if (!sessionStarted) beginSession("Couldn't find a steady pulse — started at " + bpm + " bpm.");
      }
    }

    if (!soundActive && wasActive) {
      resetCommitted();
      if (curSegment) { segments.push(curSegment); curSegment = null; }
      lastDotPc = null;
    }

    if (sessionStarted) {
      if (lastFrameNow === null) lastFrameNow = now;
      var dt = now - lastFrameNow;
      lastFrameNow = now; // keeps ticking even while paused, so resume doesn't jump the timeline

      if (!sessionPaused) {
        if (rollWithTime || soundActive) activeMs += dt;

        if (committedMidi !== null) {
          if (!curSegment || curSegment.midi !== committedMidi) {
            if (curSegment) segments.push(curSegment);
            curSegment = { midi: committedMidi, points: [] };
          }
          curSegment.points.push({ ms: activeMs, cents: committedCentsEMA });
          if (curSegment.points.length > 400) curSegment.points.shift();

          var curPc = pc(committedMidi);
          var acc = false;
          if (curPc !== lastDotPc) { acc = SHARP_BY_PC[curPc]; lastDotPc = curPc; }
          scatterPoints.push({ ms: activeMs, midi: committedMidi, cents: committedCentsEMA, acc: acc });
          if (scatterPoints.length > 20000) scatterPoints.shift();
        }

        windowStart = Math.max(0, activeMs - MAX_SECONDS * 1000);
        var cutoff = windowStart - 2000;
        while (segments.length && segments[0].points.length && segments[0].points[segments[0].points.length - 1].ms < cutoff) segments.shift();
        while (scatterPoints.length && scatterPoints[0].ms < cutoff) scatterPoints.shift();

        resizeCanvasesToWidth(Math.max(scopeScroll.clientWidth, usedWidthPx()));
      }
    }

    if (activeTab === "staff") drawStaff(); else drawContour();
    drawTimeAxis();
    followScroll();

    requestAnimationFrame(loop);
  }

  updateGutterAndOffsets();

})();
</script>
</body>
</html>
